services:
  # Development mit Hot Reload
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    network_mode: "host"
    volumes:
      - ./src:/app/src
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
    environment:
      - OLLAMA_HOST=http://localhost:11434/
      - VITE_GOOGLE_MAPS_STRICT=${VITE_GOOGLE_MAPS_STRICT:-true}
      - VITE_ADAPTER_TOKEN=${ADAPTER_TOKEN:-scoutx-internal-2026}
      - VITE_ADAPTER_TIMEOUT_MS=${VITE_ADAPTER_TIMEOUT_MS:-75000}
    profiles:
      - dev

  # Production mit Nginx
  prod:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_MAPS_STRICT: ${VITE_GOOGLE_MAPS_STRICT:-true}
        VITE_ADAPTER_TOKEN: ${ADAPTER_TOKEN:-scoutx-internal-2026}
        VITE_ADAPTER_TIMEOUT_MS: ${VITE_ADAPTER_TIMEOUT_MS:-75000}
        VITE_LOGTO_ENDPOINT: ${LOGTO_DOMAIN:+https://${LOGTO_DOMAIN}}
        VITE_LOGTO_APP_ID: ${SCOUTX_LOGTO_CLIENT_ID:-}
    network_mode: "host"
    environment:
      - OLLAMA_HOST=http://localhost:11434/
      - VITE_GOOGLE_MAPS_STRICT=${VITE_GOOGLE_MAPS_STRICT:-true}
    depends_on:
      adapter:
        condition: service_healthy
    restart: always
    profiles:
      - prod

  # Externer Adapter-Service für reale Spieldaten
  adapter:
    build:
      context: .
      dockerfile: adapter-service/Dockerfile
    network_mode: "host"
    environment:
      - ADAPTER_HOST=0.0.0.0
      - ADAPTER_PORT=8787
      - CORS_ORIGIN=*
      - ADAPTER_DATA_FILE=/app/data/games.sample.json
      - ADAPTER_STORE_FILE=/app/data/games.store.json
      - ADAPTER_IMPORT_DIR=/app/imports
      - ADAPTER_ALIASES_FILE=/app/data/team-aliases.json
      - ADAPTER_REFRESH_INTERVAL_SEC=300
      - ADAPTER_AUTO_REFRESH_WEEK=true
      - ADAPTER_WEEK_REFRESH_TTL_SEC=300
      - ADAPTER_WEEK_COMMAND_TIMEOUT_MS=60000
      - FUSSBALLDE_REQUEST_TIMEOUT_MS=20000
      - ADAPTER_EXPORT_COMMAND=node /app/adapter-service/scripts/fetch-week.fussballde.mjs
      - ADAPTER_TOKEN=${ADAPTER_TOKEN:-scoutx-internal-2026}
      # Logto-OIDC: Login nur für eingeladene Team-Mitglieder (leer = Logto-Login deaktiviert)
      - ADAPTER_LOGTO_ENDPOINT=${LOGTO_DOMAIN:+https://${LOGTO_DOMAIN}}
      - ADAPTER_LOGTO_APP_ID=${SCOUTX_LOGTO_CLIENT_ID:-}
      # - ADAPTER_WEEK_SOURCE_URL_TEMPLATE=https://example.com/api/games?from={fromDate}&to={toDate}&kreis={kreisId}&jugend={jugendId}
      # - ADAPTER_WEEK_SOURCE_TOKEN=change-me
      # - ADAPTER_REMOTE_URL=https://example.com/api/games
      # - ADAPTER_REMOTE_TOKEN=change-me
    volumes:
      - ./adapter-service/data:/app/data
      - ./adapter-service/imports:/app/imports
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then((r)=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    profiles:
      - dev
      - prod

  # Selbstgehosteter Logto-Login-Server (OIDC) mit eigener Postgres-DB.
  # Platzhalter per .env setzen: LOGTO_DOMAIN, LOGTO_ADMIN_DOMAIN, LOGTO_DB_PASSWORD.
  # Reverse Proxy zeigt auf 127.0.0.1:3001 (Core) und 127.0.0.1:3002 (Admin).
  logto-db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=logto
      - POSTGRES_PASSWORD=${LOGTO_DB_PASSWORD:-}
      - POSTGRES_DB=logto
    volumes:
      - logto-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logto -d logto"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    profiles:
      - logto

  logto:
    image: ghcr.io/logto-io/logto:latest
    entrypoint: ["sh", "-c", "npm run cli db seed -- --swe && npm start"]
    environment:
      - DB_URL=postgresql://logto:${LOGTO_DB_PASSWORD:-}@logto-db:5432/logto
      - ENDPOINT=https://${LOGTO_DOMAIN:-}
      - ADMIN_ENDPOINT=https://${LOGTO_ADMIN_DOMAIN:-}
      - TRUST_PROXY_HEADER=1
      - PORT=3001
      - ADMIN_PORT=3002
    ports:
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:3002:3002"
    depends_on:
      logto-db:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - logto

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./ops/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      adapter:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./ops/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  prometheus-data:
  alertmanager-data:
  logto-db-data:
