global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/scoutx-alerts.yml

scrape_configs:
  - job_name: "scoutx-adapter"
    metrics_path: /api/admin/metrics
    scheme: http
    authorization:
      credentials: "REPLACE_WITH_ADAPTER_TOKEN"
    static_configs:
      - targets:
          - host.docker.internal:8787
