<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><title>HRworks Mock</title></head>
<body>
  <button>Reisekostenabrechnung</button>
  <button>Neue Reisekostenabrechnung</button>
  <form>
    <label>Zweck</label>
    <input name="purpose" />
    <label>Bemerkung</label>
    <textarea name="note"></textarea>
    <label>Zeitraum</label>
    <input name="dateRange" />
    <label>Beginn Uhrzeit</label>
    <input name="startTime" />
    <label>Ende Uhrzeit</label>
    <input name="endTime" />
    <label>Abfahrtsort</label>
    <input aria-hidden="true" />
    <input name="departureLocation" />
    <label>Zielort</label>
    <input aria-hidden="true" />
    <input name="destinationLocation" />
    <label>Zwischenorte</label>
    <input name="route" />
    <label>Kostenstelle</label>
    <select name="costCenter">
      <option>Keine</option>
      <option>Junioren allgemein (321000)</option>
    </select>
    <button type="button">Speichern</button>
    <button type="button">Ja</button>
    <button type="button">Weiter zu den digitalen Belegen</button>
    <button type="button">Neue Kilometerangabe</button>
    <h2>Kilometerangabe</h2>
    <label>Datum</label>
    <input name="mileageDate" />
    <label>Abfahrtsort</label>
    <input name="mileageFrom" />
    <label>Zielort</label>
    <input name="mileageTo" />
    <label>Bemerkung</label>
    <input name="mileageNote" value="Alttext" />
    <label>Kilometer</label>
    <input name="mileageKilometers" />
    <button type="button" onclick="saveMockKilometerEntry()">Kilometerangabe speichern</button>
    <div id="saved-kilometer-entries" aria-label="Gespeicherte Kilometerangaben"></div>
    <button type="button" onclick="document.getElementById('workflow-status').textContent='route-only'">Berichte</button>
    <button type="button" onclick="document.getElementById('workflow-status').textContent='reports-page'">Abschließen</button>
    <button type="button" onclick="document.getElementById('workflow-status').textContent='confirm-open'">Final abschließen</button>
    <button type="button" onclick="document.getElementById('workflow-status').textContent='completed';document.getElementById('warning-confirmed').textContent='yes'">Ja, abschließen</button>
    <div id="workflow-status">draft</div>
    <div id="warning-confirmed">no</div>
 </form>
  <script>
    function saveMockKilometerEntry() {
      const from = document.querySelector("input[name='mileageFrom']")?.value?.trim() || "";
      const to = document.querySelector("input[name='mileageTo']")?.value?.trim() || "";
      if (!from || !to) {
        return;
      }
      const container = document.getElementById("saved-kilometer-entries");
      if (!container) {
        return;
      }
      const summary = `${from} - ${to}`;
      const existing = Array.from(container.querySelectorAll("[data-leg-summary]"))
        .some((node) => node.textContent.trim() === summary);
      if (existing) {
        return;
      }
      const entry = document.createElement("div");
      entry.setAttribute("data-leg-summary", summary);
      entry.textContent = summary;
      container.appendChild(entry);
    }
  </script>
</body>
</html>
